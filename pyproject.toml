[project]
name = "bbo-tap"
version = "0.3.0"
description = "Best bid/ask websockets from Binance, Bybit, OKX, Gate and KuCoin perps, captured verbatim to Redpanda/Kafka"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vadym O", email = "justdoitpicks@gmail.com" }]
requires-python = ">=3.13"
keywords = ["crypto", "market-data", "websocket", "bbo", "order-book", "kafka", "redpanda", "binance", "okx", "bybit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "confluent-kafka>=2.16.0",
    "prometheus-client>=0.23",
    "pyyaml>=6.0.3",
    "websockets>=17.2",
]

[project.urls]
Homepage = "https://github.com/vudya1000/bbo-tap"
Source = "https://github.com/vudya1000/bbo-tap"
Issues = "https://github.com/vudya1000/bbo-tap/issues"
Changelog = "https://github.com/vudya1000/bbo-tap/releases"

[project.scripts]
bbo-tap = "bbo_tap:main"

[project.optional-dependencies]
pubsub = [
    "google-cloud-pubsub>=2.42.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "google-cloud-pubsub>=2.42.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# An unawaited coroutine is a bug (it hid one in connection.py once).
filterwarnings = ["error::RuntimeWarning"]
markers = [
    "redpanda: needs Redpanda at localhost:9092 (skipped if unreachable)",
    "pubsub: needs the Pub/Sub emulator at localhost:8085 (skipped if unreachable)",
    "live: connects to the real exchanges (run with --live)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # modern syntax for 3.13
    "SIM",          # simplifications
    "RUF",          # ruff's own
    "ASYNC",        # asyncio pitfalls
    "PT",           # pytest style
    "N",            # naming
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# google-cloud-pubsub has inline annotations but no py.typed marker.
module = ["google.cloud.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
# Tests: annotating every test and fixture adds noise, not safety; bodies are still checked.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
