version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # confluent-kafka and pyyaml have no cp315 wheels yet; the slim image
      # can't build them from source. Drop this once they ship.
      - dependency-name: python
        versions: [">= 3.15"]
